<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSP | Kashmir Selling Point</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --main-green: #accb96; --ksp-dark: #121212; --gray: #f4f4f4; }
        body { margin: 0; font-family: 'Inter', sans-serif; background: var(--gray); padding-bottom: 60px; }

        /* HEADER & SEARCH */
        .navbar { background: white; padding: 10px 5%; position: sticky; top: 0; z-index: 1000; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .logo { font-size: 22px; font-weight: 900; margin-bottom: 10px; text-align: center; }
        .logo span { color: var(--main-green); }
        .search-area { display: flex; background: #eee; border-radius: 4px; padding: 5px 15px; align-items: center; }
        .search-area input { border: none; background: transparent; width: 100%; padding: 8px; outline: none; }

        /* TOP TABS (Amazon Logic) */
        .category-tabs { display: flex; background: var(--ksp-dark); color: white; overflow-x: auto; padding: 12px 5%; gap: 20px; font-size: 13px; }
        .category-tabs div { white-space: nowrap; cursor: pointer; opacity: 0.8; }
        .category-tabs div.active { opacity: 1; color: var(--main-green); border-bottom: 2px solid var(--main-green); }

        /* SUB-CATEGORY BUBBLES (SHEIN Style) */
        .bubbles { display: flex; overflow-x: auto; padding: 20px 5%; gap: 15px; background: white; }
        .bubble-item { text-align: center; min-width: 75px; cursor: pointer; }
        .circle { width: 65px; height: 65px; border-radius: 50%; background: #eee; margin: 0 auto 8px; border: 2px solid #ddd; overflow: hidden; }
        .circle img { width: 100%; height: 100%; object-fit: cover; }
        .bubble-item span { font-size: 11px; font-weight: 600; color: #555; }

        /* PRODUCT GRID */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 15px; }
        .card { background: white; border-radius: 8px; overflow: hidden; position: relative; }
        .card img { width: 100%; height: 220px; object-fit: cover; }
        .card-details { padding: 10px; }
        .price { color: #e91e63; font-weight: bold; font-size: 16px; }
        .condition-tag { position: absolute; top: 10px; left: 10px; background: black; color: white; padding: 2px 8px; font-size: 10px; border-radius: 3px; }

        /* CART BUTTON */
        .cart-btn { position: fixed; bottom: 20px; right: 20px; background: var(--main-green); color: white; width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.3); font-size: 24px; cursor: pointer; z-index: 2000; }
        #cart-count { position: absolute; top: 0; right: 0; background: red; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="logo">KASHMIR <span>SELLING POINT</span></div>
        <div class="search-area">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Search for Mobile, Clothes, Shoes...">
            <i class="fa fa-camera"></i>
        </div>
    </nav>

    <div class="category-tabs">
        <div class="active" onclick="showSection('Home')">Home</div>
        <div onclick="showSection('Mobiles')">Mobiles</div>
        <div onclick="showSection('Men')">Men</div>
        <div onclick="showSection('Women')">Women</div>
        <div onclick="showSection('Groceries')">Groceries</div>
    </div>

    <div class="bubbles" id="bubble-container">
        </div>

    <div class="grid" id="main-grid"></div>

    <div class="cart-btn" onclick="alert('Opening Cart...')">
        <i class="fa fa-shopping-basket"></i>
        <span id="cart-count">0</span>
    </div>

    <script>
        // Database simulation (Linking logic for your Google Sheet)
        const products = [
            { id:1, name:"Mens Silk Salwar Kameez", cat:"Men", sub:"Salwar Kameez", price:6500, cond:"New", img:"https://via.placeholder.com/220", sizes:["S","M","L","XL"] },
            { id:2, name:"iPhone 14 Pro", cat:"Mobiles", sub:"Apple", price:210000, cond:"Used", img:"https://via.placeholder.com/220" },
            { id:3, name:"Casual Men's Tracksuit", cat:"Men", sub:"Tracksuits", price:3500, cond:"New", img:"https://via.placeholder.com/220", sizes:["M","L"] }
        ];

        function showSection(section) {
            const container = document.getElementById('bubble-container');
            const grid = document.getElementById('main-grid');
            
            // 1. Update Sub-Category Bubbles
            if(section === 'Men') {
                container.innerHTML = `
                    <div class="bubble-item"><div class="circle"></div><span>Salwar Kameez</span></div>
                    <div class="bubble-item"><div class="circle"></div><span>Tracksuits</span></div>
                    <div class="bubble-item"><div class="circle"></div><span>Shirts</span></div>
                `;
            } else if(section === 'Mobiles') {
                container.innerHTML = `
                    <div class="bubble-item"><div class="circle"></div><span>New</span></div>
                    <div class="bubble-item"><div class="circle"></div><span>Used</span></div>
                `;
            }

            // 2. Filter Grid strictly
            const filtered = products.filter(p => p.cat === section);
            grid.innerHTML = filtered.map(p => `
                <div class="card">
                    <div class="condition-tag">${p.cond}</div>
                    <img src="${p.img}">
                    <div class="card-details">
                        <p style="font-size:12px; margin:0;">${p.name}</p>
                        <div class="price">Rs. ${p.price}</div>
                        ${p.sizes ? `<select style="width:100%; margin-top:5px;"><option>Choose Size</option>${p.sizes.map(s=>`<option>${s}</option>`)}</select>` : ''}
                        <button style="width:100%; border:none; background:var(--ksp-dark); color:white; padding:8px; margin-top:8px;">Add to Cart</button>
                    </div>
                </div>
            `).join('');
        }

        window.onload = () => showSection('Men');
    </script>
</body>
</html>
