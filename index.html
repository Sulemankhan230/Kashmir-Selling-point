<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Selling Point | Pakistan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Nastaliq+Urdu&display=swap');
        body { background-color: #050505; color: #fff; font-family: 'Segoe UI', sans-serif; }
        .urdu { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.8; text-align: right; }
        .page { display: none; min-height: 80vh; animation: fadeIn 0.4s ease-in-out; }
        .active-page { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .gold-border { border: 1px solid #d4af37; }
        .en-text { display: block; }
        .urdu-text { display: none; }
        .lang-ur .en-text { display: none; }
        .lang-ur .urdu-text { display: block; }
    </style>
</head>
<body class="lang-en" id="mainBody">

    <nav class="p-4 bg-zinc-950 border-b border-zinc-800 sticky top-0 z-50 flex justify-between items-center">
        <div onclick="showPage('home')" class="text-xl font-black text-yellow-500 cursor-pointer">KASHMIR SHOP</div>
        <div class="flex items-center gap-3">
            <select onchange="sortProducts(this.value)" class="bg-zinc-800 text-[10px] p-1 rounded border border-zinc-700">
                <option value="none">Sort Price</option>
                <option value="low">Low to High</option>
                <option value="high">High to Low</option>
            </select>
            <button onclick="toggleLang()" class="bg-yellow-600 text-black font-bold px-3 py-1 rounded-full text-xs">اردو / EN</button>
        </div>
    </nav>

    <div class="bg-zinc-900 flex justify-center gap-6 py-3 text-xs border-b border-zinc-800 font-bold uppercase tracking-widest">
        <span onclick="showPage('home')" class="cursor-pointer hover:text-yellow-500">Home</span>
        <span onclick="showPage('gadgets')" class="cursor-pointer hover:text-yellow-500">Gadgets</span>
        <span onclick="showPage('clothes')" class="cursor-pointer hover:text-yellow-500">Clothes</span>
    </div>

    <section id="home" class="page active-page">
        <div class="h-64 bg-gradient-to-b from-zinc-800 to-black flex items-center justify-center text-center p-6">
            <div>
                <h1 class="text-3xl font-bold en-text">Best Products from Pakistan</h1>
                <h1 class="text-3xl urdu urdu-text">پاکستان کی بہترین مصنوعات</h1>
                <p class="text-yellow-500 mt-2">Quality & Trust / معیار اور بھروسہ</p>
            </div>
        </div>
        <div class="p-6 grid grid-cols-1 md:grid-cols-2 gap-4 max-w-4xl mx-auto">
            <div onclick="showPage('gadgets')" class="gold-border p-8 rounded-2xl bg-zinc-900 text-center cursor-pointer">
                <h2 class="text-xl font-bold en-text">Mobile Gadgets</h2>
                <h2 class="urdu text-2xl urdu-text">موبائل گیجٹس</h2>
            </div>
            <div onclick="showPage('clothes')" class="gold-border p-8 rounded-2xl bg-zinc-900 text-center cursor-pointer">
                <h2 class="text-xl font-bold en-text">Kashmiri Clothes</h2>
                <h2 class="urdu text-2xl urdu-text">کشمیری کپڑے</h2>
            </div>
        </div>
    </section>

    <section id="gadgets" class="page p-6"><div id="gadgets-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></section>
    <section id="clothes" class="page p-6"><div id="clothes-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div></section>

    <section id="checkout" class="page p-6 max-w-lg mx-auto">
        <div class="bg-zinc-900 p-6 rounded-3xl gold-border">
            <h2 class="text-2xl font-bold mb-4 text-yellow-500 en-text">Customer Details</h2>
            <h2 class="urdu text-2xl mb-4 text-yellow-500 urdu-text">گاہک کی تفصیلات</h2>
            <div class="space-y-4">
                <input id="userName" type="text" placeholder="Full Name / نام" class="w-full p-4 bg-black rounded-xl border border-zinc-700">
                <input id="userPhone" type="text" placeholder="WhatsApp Number / واٹس ایپ نمبر" class="w-full p-4 bg-black rounded-xl border border-zinc-700">
                <textarea id="userAddress" placeholder="Full Home Address / گھر کا پتہ" class="w-full p-4 bg-black rounded-xl border border-zinc-700"></textarea>
                <button onclick="getLocation()" class="text-xs text-blue-400">📍 Add My Location / لوکیشن شامل کریں</button>
                
                <div class="p-4 bg-zinc-800 rounded-xl border border-zinc-600">
                    <p class="font-bold mb-2">Payment / ادائیگی:</p>
                    <label class="block mb-2"><input type="radio" name="pay" value="Online"> Online Transfer (EasyPaisa/JazzCash)</label>
                    <label class="block"><input type="radio" name="pay" value="COD"> Cash on Delivery (ڈیلیوری پر رقم)</label>
                </div>
                
                <button onclick="sendOrder()" class="w-full bg-yellow-600 text-black p-4 rounded-xl font-bold text-xl shadow-lg">PLACE ORDER</button>
            </div>
        </div>
    </section>

    <script>
        let allItems = [];
        let selectedProduct = "";
        const SHEET_ID = '1NuErsJKYdqsmh-dgE8KmZmSLpfque6HJn_P8to20Od0';

        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active-page'));
            document.getElementById(id).classList.add('active-page');
            window.scrollTo(0,0);
        }

        function toggleLang() {
            document.getElementById('mainBody').classList.toggle('lang-ur');
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('userAddress').value += `\nLocation: https://www.google.com/maps?q=${pos.coords.latitude},${pos.coords.longitude}`;
                    alert("Location Added!");
                });
            }
        }

        fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json`)
            .then(res => res.text()).then(text => {
                const data = JSON.parse(text.substr(47).slice(0,-2));
                allItems = data.table.rows.slice(1).map(r => ({
                    en: r.c[1]?.v, ur: r.c[2]?.v, price: r.c[3]?.v, cat: r.c[4]?.v?.toLowerCase(), img: r.c[5]?.v
                }));
                render(allItems);
            });

        function render(list) {
            const gGrid = document.getElementById('gadgets-grid');
            const cGrid = document.getElementById('clothes-grid');
            gGrid.innerHTML = ''; cGrid.innerHTML = '';
            list.forEach(p => {
                const html = `
                    <div class="bg-zinc-900 rounded-2xl overflow-hidden gold-border p-4">
                        <img src="${p.img}" class="w-full h-48 object-cover rounded-xl mb-4">
                        <h3 class="font-bold en-text">${p.en}</h3>
                        <h3 class="urdu text-xl urdu-text">${p.ur}</h3>
                        <p class="text-xl font-black text-yellow-500 my-2">Rs. ${p.price}</p>
                        <button onclick="selectedProduct='${p.en}'; showPage('checkout')" class="w-full bg-white text-black py-2 rounded-lg font-bold">Add to Cart</button>
                    </div>`;
                if(p.cat.includes('gadget')) gGrid.innerHTML += html;
                else if(p.cat.includes('clothe')) cGrid.innerHTML += html;
            });
        }

        function sortProducts(val) {
            let sorted = [...allItems];
            if(val === 'low') sorted.sort((a,b) => a.price - b.price);
            if(val === 'high') sorted.sort((a,b) => b.price - a.price);
            render(sorted);
        }

        function sendOrder() {
            const name = document.getElementById('userName').value;
            const phone = document.getElementById('userPhone').value;
            const addr = document.getElementById('userAddress').value;
            const pay = document.querySelector('input[name="pay"]:checked')?.value;
            if(!name || !phone || !addr || !pay) return alert("Fill all fields!");

            const msg = `🚀 *NEW ORDER*\nItem: ${selectedProduct}\nName: ${name}\nPhone: ${phone}\nAddress: ${addr}\nPayment: ${pay}`;
            window.open(`https://wa.me/92 348 8463351?text=${encodeURIComponent(msg)}`); // PUT YOUR NUMBER HERE
        }
    </script>
</body>
</html>
