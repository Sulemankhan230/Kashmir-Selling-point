<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kashmir Selling Point | Modern Luxury</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: #050505; 
            color: #ffffff;
            scroll-behavior: smooth;
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .luxury-gradient {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
        }

        .ksp-gold { color: #d4af37; }
        .bg-ksp-gold { background: #d4af37; }

        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }

        /* Animation for SHEIN Bubbles */
        .bubble-scroll::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="luxury-gradient">

    <nav class="sticky top-0 z-50 glass border-b border-white/5 px-6 py-4 flex justify-between items-center">
        <div class="text-2xl font-extrabold tracking-tighter">
            KASHMIR <span class="ksp-gold">SELLING POINT</span>
        </div>
        
        <div class="hidden md:flex space-x-8 text-sm font-medium opacity-70">
            <a href="#" class="hover:opacity-100 transition" onclick="renderByCat('All')">Home</a>
            <a href="#" class="hover:opacity-100 transition" onclick="renderByCat('Mobiles')">Mobiles</a>
            <a href="#" class="hover:opacity-100 transition" onclick="renderByCat('Men')">Men</a>
            <a href="#" class="hover:opacity-100 transition" onclick="renderByCat('Women')">Women</a>
        </div>

        <div class="flex items-center space-x-6">
            <i class="fa fa-search opacity-70 cursor-pointer"></i>
            <div class="relative cursor-pointer" onclick="toggleCart()">
                <i class="fa fa-shopping-bag text-xl"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-ksp-gold text-black text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-bold">0</span>
            </div>
            <i class="fa fa-user-circle text-xl opacity-70"></i>
        </div>
    </nav>

    <div class="bubble-scroll flex overflow-x-auto space-x-6 px-6 py-8">
        <div class="flex-shrink-0 text-center cursor-pointer" onclick="renderByCat('Mobiles')">
            <div class="w-16 h-16 rounded-full glass flex items-center justify-center border-ksp-gold/30 border mb-2 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1592899677977-9c10ca588bbd?w=200" class="object-cover w-full h-full">
            </div>
            <span class="text-[10px] font-bold uppercase">Phones</span>
        </div>
        <div class="flex-shrink-0 text-center cursor-pointer" onclick="renderByCat('Men')">
            <div class="w-16 h-16 rounded-full glass flex items-center justify-center border-white/10 border mb-2 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?w=200" class="object-cover w-full h-full">
            </div>
            <span class="text-[10px] font-bold uppercase">Salwar</span>
        </div>
        <div class="flex-shrink-0 text-center cursor-pointer" onclick="renderByCat('Groceries')">
            <div class="w-16 h-16 rounded-full glass flex items-center justify-center border-white/10 border mb-2 overflow-hidden">
                <img src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=200" class="object-cover w-full h-full">
            </div>
            <span class="text-[10px] font-bold uppercase">Groceries</span>
        </div>
        </div>

    <main class="px-6 pb-20">
        <div class="flex justify-between items-center mb-8">
            <h2 id="cat-title" class="text-3xl font-bold tracking-tight">Luxury Arrivals</h2>
            <div class="flex space-x-2">
                <button class="px-4 py-2 glass rounded-full text-xs" onclick="filterCondition('New')">New</button>
                <button class="px-4 py-2 glass rounded-full text-xs" onclick="filterCondition('Used')">Used</button>
            </div>
        </div>

        <div id="product-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <div id="cart-sidebar" class="fixed right-0 top-0 h-full w-full md:w-[400px] bg-[#0a0a0a] z-[100] transform translate-x-full transition-transform duration-500 p-8 border-l border-white/10">
        <div class="flex justify-between items-center mb-10">
            <h2 class="text-2xl font-bold">Your Bag</h2>
            <i class="fa fa-times text-2xl cursor-pointer" onclick="toggleCart()"></i>
        </div>
        <div id="cart-list" class="space-y-6">
            <p class="opacity-50">Nothing here yet.</p>
        </div>
        <div class="absolute bottom-10 left-8 right-8">
            <div class="flex justify-between mb-4 text-xl font-bold">
                <span>Total</span>
                <span id="cart-total">Rs. 0</span>
            </div>
            <button class="w-full py-4 bg-ksp-gold text-black font-bold rounded-xl uppercase tracking-widest hover:bg-white transition">Secure Checkout</button>
        </div>
    </div>

    <script>
        // MASTER DATABASE (Mocking your Prisma/Google Sheets integration)
        const products = [
            { id: 1, name: "Premium Pashmina Salwar", cat: "Men", sub: "Salwar", price: 8500, cond: "New", img: "https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?w=500", seller: "S01", status: "Active" },
            { id: 2, name: "iPhone 15 Pro - Titanium", cat: "Mobiles", sub: "Apple", price: 345000, cond: "New", img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?w=500", seller: "S02", status: "Active" },
            { id: 3, name: "Vintage Used Denim", cat: "Men", sub: "Jeans", price: 4500, cond: "Used", img: "https://images.unsplash.com/photo-1542272604-787c3835535d?w=500", seller: "S03", status: "Blocked" },
            { id: 4, name: "Organic Kashmiri Saffron", cat: "Groceries", sub: "Spices", price: 2500, cond: "New", img: "https://images.unsplash.com/photo-1509358271058-acd22cc93898?w=500", seller: "S01", status: "Active" }
        ];

        let cart = [];

        function renderProducts(data) {
            const grid = document.getElementById('product-grid');
            // THE ADMIN RULE: Filter out "Blocked" sellers automatically
            const activeItems = data.filter(p => p.status === "Active");
            
            grid.innerHTML = activeItems.map(p => `
                <div class="card group relative">
                    <div class="relative overflow-hidden rounded-2xl aspect-[3/4]">
                        <div class="absolute top-4 left-4 z-10 glass px-3 py-1 rounded-full text-[10px] font-bold uppercase tracking-tighter">${p.cond}</div>
                        <img src="${p.img}" class="object-cover w-full h-full transition duration-700 group-hover:scale-110">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <button onclick="addToCart(${p.id})" class="bg-white text-black px-6 py-2 rounded-full font-bold text-sm transform translate-y-4 group-hover:translate-y-0 transition">Add to Bag</button>
                        </div>
                    </div>
                    <div class="mt-4 px-2">
                        <h4 class="text-sm opacity-70 font-medium">${p.name}</h4>
                        <p class="text-lg font-bold mt-1">Rs. ${p.price.toLocaleString()}</p>
                        ${p.cat === 'Men' || p.cat === 'Women' ? 
                          `<select class="mt-2 w-full bg-transparent border-white/10 border rounded p-1 text-[10px]">
                            <option>Size: M</option><option>Size: L</option><option>Size: XL</option>
                           </select>` : ''}
                    </div>
                </div>
            `).join('');
        }

        function renderByCat(cat) {
            const filtered = cat === 'All' ? products : products.filter(p => p.cat === cat);
            document.getElementById('cat-title').innerText = cat + " Selection";
            renderProducts(filtered);
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('translate-x-full');
        }

        function addToCart(id) {
            const p = products.find(i => i.id === id);
            cart.push(p);
            document.getElementById('cart-count').innerText = cart.length;
            updateCartList();
        }

        function updateCartList() {
            const list = document.getElementById('cart-list');
            const total = cart.reduce((sum, item) => sum + item.price, 0);
            list.innerHTML = cart.map(i => `
                <div class="flex justify-between items-center">
                    <span class="text-sm">${i.name}</span>
                    <span class="font-bold">Rs. ${i.price}</span>
                </div>
            `).join('');
            document.getElementById('cart-total').innerText = "Rs. " + total.toLocaleString();
        }

        window.onload = () => renderProducts(products);
    </script>
</body>
</html>
