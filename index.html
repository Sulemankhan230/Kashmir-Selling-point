<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KSP | Kashmir Selling Point</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --shein-green: #accb96;
            --bg-light: #f7f8fa;
            --white: #ffffff;
        }

        body { margin: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; background: var(--bg-light); color: #333; padding-bottom: 70px; }

        /* TOP NAVIGATION (SHEIN STYLE) */
        .top-nav { background: var(--shein-green); padding: 10px 15px; position: sticky; top: 0; z-index: 1000; }
        .search-container { display: flex; align-items: center; background: white; border-radius: 4px; padding: 5px 10px; gap: 10px; }
        .search-container input { border: none; flex: 1; padding: 8px; font-size: 14px; outline: none; }
        .search-container i { color: #999; cursor: pointer; }

        .category-tabs { display: flex; overflow-x: auto; padding: 10px 0; gap: 20px; color: white; scrollbar-width: none; }
        .category-tabs div { white-space: nowrap; font-size: 14px; font-weight: 500; opacity: 0.9; cursor: pointer; }
        .category-tabs .active { opacity: 1; border-bottom: 2px solid white; font-weight: bold; }

        /* PROMO BANNER */
        .hero-banner { width: 100%; height: 200px; background: url('https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=1000') center/cover; position: relative; }
        .hero-text { position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 1px 1px 5px rgba(0,0,0,0.5); }

        /* CIRCLE CATEGORIES (AS SEEN IN SHEIN) */
        .circle-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; padding: 20px 15px; background: white; }
        .circle-item { text-align: center; }
        .circle-img { width: 60px; height: 60px; border-radius: 50%; background: #eee; margin: 0 auto 8px; overflow: hidden; border: 1px solid #f0f0f0; }
        .circle-img img { width: 100%; height: 100%; object-fit: cover; }
        .circle-item span { font-size: 11px; color: #444; display: block; height: 30px; overflow: hidden; }

        /* PRODUCT GRID (SUPER DEALS) */
        .section-header { padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .section-header h3 { margin: 0; font-size: 18px; font-style: italic; color: #e91e63; }
        
        .product-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 10px; }
        .product-card { background: white; border-radius: 8px; overflow: hidden; position: relative; }
        .product-card img { width: 100%; height: 220px; object-fit: cover; }
        .product-info { padding: 10px; }
        .product-price { color: #e91e63; font-weight: bold; font-size: 16px; }
        .old-price { text-decoration: line-through; color: #999; font-size: 12px; margin-left: 5px; }

        /* BOTTOM BAR */
        .bottom-nav { position: fixed; bottom: 0; width: 100%; background: white; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #eee; }
        .nav-item { text-align: center; color: #666; font-size: 11px; cursor: pointer; }
        .nav-item i { font-size: 20px; display: block; margin-bottom: 3px; }
        .nav-item.active { color: #000; }

        /* CART MODAL */
        #cart-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 2000; }
        .cart-content { background: white; width: 90%; margin: 50px auto; padding: 20px; border-radius: 10px; max-height: 80vh; overflow-y: auto; color: #333;}
    </style>
</head>
<body>

    <div class="top-nav">
        <div class="search-container">
            <i class="fa fa-search"></i>
            <input type="text" placeholder="Instant Print Camera">
            <i class="fa fa-camera"></i>
        </div>
        <div class="category-tabs">
            <div class="active">All</div>
            <div>Women</div>
            <div>Kids</div>
            <div>Men</div>
            <div>Electronics</div>
            <div>Home</div>
        </div>
    </div>

    <div class="hero-banner">
        <div class="hero-text">
            <h2>STYLE NOTES</h2>
            <p>Outfits for every kind of plan</p>
        </div>
    </div>

    <div class="circle-menu">
        <div class="circle-item">
            <div class="circle-img"><img src="https://m.media-amazon.com/images/I/71pC69I3lzL._AC_UY1100_.jpg"></div>
            <span>Men's Wear</span>
        </div>
        <div class="circle-item">
            <div class="circle-img"><img src="https://m.media-amazon.com/images/I/61mZ5Y6XfKL._AC_SL1500_.jpg"></div>
            <span>Mobiles</span>
        </div>
        <div class="circle-item">
            <div class="circle-img"><img src="https://m.media-amazon.com/images/I/81R4BfG2pDL._AC_SL1500_.jpg"></div>
            <span>Groceries</span>
        </div>
        <div class="circle-item">
            <div class="circle-img"><img src="https://m.media-amazon.com/images/I/71X82H1K1hL._AC_SL1500_.jpg"></div>
            <span>Household</span>
        </div>
    </div>

    <div class="section-header">
        <h3>⚡ Super Deals</h3>
        <span style="font-size: 12px; color: #666;">View All ></span>
    </div>

    <div class="product-grid" id="main-grid">
        </div>

    <div class="bottom-nav">
        <div class="nav-item active"><i class="fa fa-home"></i>Shop</div>
        <div class="nav-item"><i class="fa fa-th-large"></i>Category</div>
        <div class="nav-item" onclick="openCart()"><i class="fa fa-shopping-cart"></i>Cart <span id="cart-badge">0</span></div>
        <div class="nav-item"><i class="fa fa-user"></i>Me</div>
    </div>

    <div id="cart-modal" onclick="closeCart()">
        <div class="cart-content" onclick="event.stopPropagation()">
            <h2>Shopping Cart</h2>
            <div id="cart-items">Your cart is empty.</div>
            <hr>
            <button style="width:100%; padding:15px; background:black; color:white; border:none; margin-top:20px;">Checkout Now</button>
        </div>
    </div>

    <script>
        // Data Structure for Amazon/SHEIN style logic
        const catalog = [
            { id: 101, name: "Formal Salwar Kameez", cat: "Men", price: 3500, old: 5000, img: "https://images.unsplash.com/photo-1598514982205-f36b96d1e8d4?q=80&w=500", approved: true },
            { id: 102, name: "iPhone 15 Pro Max", cat: "Electronics", price: 345000, old: 360000, img: "https://images.unsplash.com/photo-1695048133142-1a20484d2569?q=80&w=500", approved: true },
            { id: 103, name: "Premium Oud Perfume", cat: "Beauty", price: 8500, old: 10000, img: "https://images.unsplash.com/photo-1541643600914-78b084683601?q=80&w=500", approved: true }
        ];

        let cart = [];

        function loadProducts() {
            const grid = document.getElementById('main-grid');
            grid.innerHTML = catalog.filter(p => p.approved).map(p => `
                <div class="product-card">
                    <img src="${p.img}" alt="${p.name}">
                    <div class="product-info">
                        <p style="font-size:12px; margin:0; height:32px; overflow:hidden;">${p.name}</p>
                        <span class="product-price">Rs.${p.price}</span>
                        <span class="old-price">Rs.${p.old}</span>
                        <button onclick="addToCart(${p.id})" style="width:100%; border:1px solid #ccc; background:none; font-size:12px; margin-top:5px; padding:3px; cursor:pointer;">+ Add</button>
                    </div>
                </div>
            `).join('');
        }

        function addToCart(id) {
            const item = catalog.find(p => p.id === id);
            cart.push(item);
            document.getElementById('cart-badge').innerText = cart.length;
            alert(item.name + " added to cart!");
        }

        function openCart() { document.getElementById('cart-modal').style.display = 'block'; }
        function closeCart() { document.getElementById('cart-modal').style.display = 'none'; }

        window.onload = loadProducts;
    </script>
</body>
</html>
